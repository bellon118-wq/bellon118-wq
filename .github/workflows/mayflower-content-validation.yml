name: Mayflower content validation

on:
  push:
    branches:
      - main
      - feature/mayflower-sanctuary-full-upgrade
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check game.js && node --check dashboard.js && node --check assets/js/site-navigation.js && node --check assets/js/quest-journal.js && node --check assets/js/inventory.js
      - name: Validate canonical content and routes
        run: node scripts/validate-content.mjs
