name: Mayflower content validation

on:
  push:
    branches:
      - main
      - feature/mayflower-sanctuary-full-upgrade
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check game.js && node --check dashboard.js && node --check assets/js/site-navigation.js && node --check assets/js/quest-journal.js && node --check assets/js/inventory.js && node --check assets/js/discovery-journal.js && node --check assets/js/gallery-discovery.js && node --check assets/js/companion-bonds.js && node --check assets/js/muse-core.js && node --check assets/js/youthspark-dialogue.js && node --check assets/js/youthspark-ai-gateway.js
      - name: Test YouthSpark AI gateway safety
        run: node scripts/test-youthspark-ai-gateway.mjs
      - name: Validate canonical content and routes
        run: node scripts/validate-content.mjs
