<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">Witchlight Pavilion miniature fantasy home</title>
  <desc id="desc">A bright, hand-built-style cutaway pavilion dollhouse with layered blue-gray roofs, walnut beams, glowing rooms, a tiny courtyard, and a pink flowering tree.</desc>
  <defs>
    <linearGradient id="backdrop" x2="0" y2="1">
      <stop stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#e8e4dc"/>
    </linearGradient>
    <linearGradient id="timber" x2="1" y2="1">
      <stop stop-color="#76513b"/>
      <stop offset=".48" stop-color="#43312b"/>
      <stop offset="1" stop-color="#271f20"/>
    </linearGradient>
    <linearGradient id="roof" x2="0" y2="1">
      <stop stop-color="#8497a1"/>
      <stop offset=".45" stop-color="#617784"/>
      <stop offset="1" stop-color="#354a55"/>
    </linearGradient>
    <linearGradient id="plaster" x2="0" y2="1">
      <stop stop-color="#fff3d5"/>
      <stop offset="1" stop-color="#dec291"/>
    </linearGradient>
    <linearGradient id="floor" x2="0" y2="1">
      <stop stop-color="#c9995e"/>
      <stop offset="1" stop-color="#805738"/>
    </linearGradient>
    <linearGradient id="lit-room" x2="0" y2="1">
      <stop stop-color="#fff3b9"/>
      <stop offset="1" stop-color="#f2a84d"/>
    </linearGradient>
    <linearGradient id="vermilion" x2="0" y2="1">
      <stop stop-color="#bd5147"/>
      <stop offset="1" stop-color="#7d2d2d"/>
    </linearGradient>
    <pattern id="roof-lines" width="26" height="16" patternUnits="userSpaceOnUse">
      <path d="M0 1q13 9 26 0M-13 9q13 9 26 0M13 9q13 9 26 0" fill="none" stroke="#c1c9c5" stroke-width="1.1" opacity=".62"/>
    </pattern>
    <pattern id="screen" width="17" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 0h17v18H0zM8.5 0v18M0 9h17" fill="none" stroke="#714b34" stroke-width="1.6"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <rect width="1000" height="760" fill="url(#backdrop)"/>
